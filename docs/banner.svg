  <text x="222" y="174" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#64748B">Multi-tenant Row-Level Security you can prove, not just hope.</text>

